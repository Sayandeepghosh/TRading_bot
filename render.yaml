# ---------------------------------------------------------------------------
#  Render blueprint. Push this file, then in Render: New > Blueprint > pick repo.
#
#  Free plan realities, as of 2026:
#    - The service spins down after 15 minutes with no inbound traffic and takes
#      about a minute to wake. WebSocket messages count as inbound traffic, so
#      while your dashboard tab is open it keeps itself awake.
#    - 750 instance hours per workspace per month.
#    - 5 GB bandwidth per month. This app is light, but 400-bar chart payloads
#      are not free; do not leave it open all day if that budget matters.
#    - No persistent disk on the free plan, so .cache is ephemeral and every
#      cold start re-downloads price history. Correct, just slower on wake.
#
#  If sleeping bothers you, use an always-on VM. See deploy/README.md.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: equity-analyser
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"

      # Free instances get 512 MB RAM. Measured peak usage of a cold scan:
      #   NIFTY50   224 MB   comfortable
      #   NIFTY100  305 MB   fits, but ~60% of budget before web overhead
      #   NIFTY200+          will be OOM-killed
      # NIFTY50 by default so the free tier is reliable. Change it in the Render
      # dashboard (Environment tab) if you move to a paid instance.
      - key: ANALYSER_UNIVERSE
        value: NIFTY50

      # ---- authentication -------------------------------------------------
      # A Render URL is public and this app has write routes (/settings, and
      # holdings add/delete). Auth is therefore mandatory here: with no password
      # set the app generates a random one at boot and prints it to the logs,
      # rather than serving an unauthenticated write API to the internet.
      #
      # sync: false means Render prompts you for the value at deploy time and
      # keeps it out of git. Pick something strong.
      - key: ANALYSER_PASSWORD
        sync: false

      # Signs session cookies. Render generates it once and keeps it stable, so
      # you stay logged in across restarts and redeploys.
      - key: ANALYSER_SECRET_KEY
        generateValue: true

      # Set your real capital here in the dashboard rather than in config.yaml,
      # so a personal number never lands in git.
      - key: ANALYSER_CAPITAL
        sync: false
      # - key: ANALYSER_RISK_PCT
      #   value: "1.0"

      # Render injects PORT itself and run.py reads it.
      # Do not set PORT here: a hardcoded value that disagrees with the one
      # Render assigns makes the health check hit a closed socket.
